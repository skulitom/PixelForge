name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm pack --dry-run

  # Builds the portable Windows ZIP on a fresh runner and runs it the way a PC without developer tools would.
  studio:
    name: Portable Studio / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the ZIP
        run: node scripts/build-studio.mjs
      - name: Build it again and compare
        run: node scripts/build-studio.mjs --check
      - name: Verify the ZIP with Node.js and git off PATH
        run: |
          $zip = (Get-Item dist/PixelForgeStudio-*-win-x64.zip).FullName
          Get-Content "$zip.sha256"
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/studio"
          $node = (Get-Item "$env:RUNNER_TEMP/studio/*/runtime/node.exe").FullName
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command node, git -ErrorAction SilentlyContinue) { throw 'Node.js or git is still on PATH' }
          & $node scripts/verify-studio.mjs $zip
      - name: Run the test suite on the bundled runtime
        run: '& (Get-Item "$env:RUNNER_TEMP/studio/*/runtime/node.exe").FullName --test'
